<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>BillFix - Everything can be solved</title>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#f3f6f4;
 color:#17231d;
 font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

.app{
 max-width:540px;
 margin:auto
}

header{
 background:white;
 padding:22px 18px;
 border-bottom:1px solid #dce5df
}

.logo{
 font-size:30px;
 font-weight:900
}

.tag{
 color:#68766e;
 font-size:14px;
 margin-top:3px
}

.motto{
 font-weight:850;
 margin-top:9px
}

main{
 padding:16px
}

.hero{
 background:#17231d;
 color:white;
 border-radius:22px;
 padding:21px
}

.hero small{
 opacity:.7
}

.big{
 font-size:40px;
 font-weight:900;
 margin:4px 0
}

.stats{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px;
 margin-top:14px
}

.stat{
 background:#29352f;
 border-radius:13px;
 padding:11px
}

.stat small{
 opacity:.7
}

.stat b{
 display:block;
 font-size:18px;
 margin-top:3px
}

.card{
 background:white;
 border:1px solid #dce5df;
 border-radius:18px;
 padding:16px;
 margin-top:14px
}

.title{
 font-size:18px;
 font-weight:850;
 margin-bottom:10px
}

.row{
 display:flex;
 justify-content:space-between;
 align-items:center;
 gap:10px;
 padding:11px 0;
 border-bottom:1px solid #edf0ee
}

.row:last-child{
 border-bottom:0
}

.name{
 font-weight:750
}

.muted{
 font-size:13px;
 color:#718078;
 margin-top:4px
}

.money{
 font-weight:800;
 white-space:nowrap
}

.btn{
 width:100%;
 min-height:46px;
 border:0;
 border-radius:13px;
 padding:12px;
 font-size:15px;
 font-weight:800
}

.primary{
 background:#176b4b;
 color:white
}

.secondary{
 background:#e8efea;
 color:#17231d;
 margin-top:10px
}

.small{
 width:auto;
 min-height:36px;
 padding:7px 10px;
 font-size:12px
}

.notice{
 margin-top:14px;
 padding:14px;
 border-radius:15px;
 background:#e8f4ed;
 font-size:14px;
 line-height:1.5
}

.tip{
 margin-top:10px;
 padding:12px;
 border-radius:13px;
 background:#fff7df;
 font-size:14px;
 line-height:1.5
}

.warning{
 background:#fff1d3
}

.danger{
 background:#fde7e5
}

.empty{
 color:#75827a;
 font-size:14px;
 padding:7px 0
}

.paid{
 opacity:.6
}

.paid .name{
 text-decoration:line-through
}

.check{
 width:36px;
 height:36px;
 border:0;
 border-radius:9px;
 background:#e8efea;
 color:#176b4b;
 font-size:18px
}

.check.on{
 background:#176b4b;
 color:white
}

.billrow{
 display:flex;
 align-items:center;
 gap:9px;
 min-width:0
}

.badge{
 display:inline-block;
 padding:4px 8px;
 border-radius:999px;
 background:#e8efea;
 font-size:11px;
 font-weight:750
}

label{
 display:block;
 font-size:13px;
 font-weight:750;
 margin-top:12px
}

input,select{
 width:100%;
 height:48px;
 margin-top:5px;
 border:1px solid #ccd6cf;
 border-radius:11px;
 padding:10px;
 font-size:16px;
 background:white
}

.two{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:10px
}

.help a{
 display:block;
 color:#176b4b;
 text-decoration:none;
 font-weight:750;
 padding:6px 0
}

.modal{
 display:none;
 position:fixed;
 inset:0;
 background:#0008;
 align-items:flex-end;
 justify-content:center;
 padding:12px;
 z-index:10
}

.sheet{
 background:white;
 border-radius:22px;
 padding:18px;
 width:100%;
 max-width:520px;
 max-height:92vh;
 overflow:auto
}

.head{
 display:flex;
 justify-content:space-between;
 align-items:center
}

.close{
 width:40px;
 height:40px;
 border:0;
 border-radius:50%;
 background:#edf1ee;
 font-size:22px
}
</style>
</head>
